<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Deep space background gradient -->
    <radialGradient id="bg" cx="35%" cy="30%" r="85%">
      <stop offset="0%" stop-color="#161630"/>
      <stop offset="100%" stop-color="#05050E"/>
    </radialGradient>

    <!-- Electric teal-to-blue lens ring gradient -->
    <linearGradient id="lensGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FFD1"/>
      <stop offset="55%" stop-color="#00C8FF"/>
      <stop offset="100%" stop-color="#0070FF"/>
    </linearGradient>

    <!-- Arrow: crisp white fading to icy teal -->
    <linearGradient id="arrowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#C8F8FF"/>
    </linearGradient>

    <!-- Tray: horizontal teal sweep -->
    <linearGradient id="trayGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FFD1"/>
      <stop offset="100%" stop-color="#0088FF"/>
    </linearGradient>

    <!-- Glow filter for lens ring -->
    <filter id="ringGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Glow filter for arrow -->
    <filter id="arrowGlow" x="-30%" y="-20%" width="160%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Tight glow for accent dot and tray -->
    <filter id="dotGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background rounded rectangle -->
  <rect width="512" height="512" fill="url(#bg)" rx="108"/>

  <!-- Inner border: barely-there highlight -->
  <rect x="2.5" y="2.5" width="507" height="507" fill="none"
        stroke="rgba(255,255,255,0.06)" stroke-width="3" rx="107"/>

  <!-- Outer lens ring — dashed to simulate 4 aperture blades -->
  <!-- r=158, circumference ≈ 993px → dasharray="232 16.25" × 4 ≈ 993 -->
  <circle cx="256" cy="256" r="158" fill="none"
          stroke="url(#lensGrad)" stroke-width="16"
          stroke-dasharray="232 16.25"
          transform="rotate(22.5, 256, 256)"
          filter="url(#ringGlow)"
          stroke-linecap="round"/>

  <!-- Inner concentric ring: subtle depth -->
  <circle cx="256" cy="256" r="128" fill="none"
          stroke="rgba(0,220,255,0.11)" stroke-width="2"/>

  <!-- Download arrow — single unified path, chunky and geometric -->
  <!-- Body 40px wide (238–278), head 112px wide (200–312), tip y=346 -->
  <path d="M 238 152 H 274 V 284 H 310 L 256 346 L 202 284 H 238 Z"
        fill="url(#arrowGrad)" filter="url(#arrowGlow)"/>

  <!-- Download tray bar -->
  <rect x="196" y="364" width="120" height="14" rx="7"
        fill="url(#trayGrad)" filter="url(#dotGlow)"/>

  <!-- Accent dot — top-right, echoing the Instagram viewfinder dot -->
  <circle cx="374" cy="138" r="17" fill="#FF1F5B" filter="url(#dotGlow)"/>
</svg>
